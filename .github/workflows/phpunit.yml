name: Run PHPUnit Tests

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  
jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        tools: phpunit
        coverage: xdebug
        ini-values: memory_limit=-1  # Prevent memory issues

    - name: Update dependencies
      run: |
        composer validate
        composer update --prefer-dist --no-progress

    - name: Create coverage directory
      run: mkdir -p coverage-report && chmod 777 coverage-report

    - name: Run PHPUnit tests
      run: |
        vendor/bin/phpunit \
          --configuration phpunit.xml \
          --coverage-html ${{ github.workspace }}/coverage-report
        # Debugging
        ls -la ${{ github.workspace }}/coverage-report

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ${{ github.workspace }}/coverage-report/
        if-no-files-found: error  # Fail if no files
