name: Run PHPUnit Tests

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # 👈 Allows manual triggering

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ github.event.inputs.php_version || '8.1' }}  # 👈 Dynamic PHP version
        tools: phpunit
        coverage: ${{ (github.event.inputs.enable_coverage != false) && 'xdebug' || 'none' }}  # 👈 Conditional Xdebug

    - name: Update dependencies
      run: composer update --prefer-dist --no-progress

    - name: Create coverage directory
      if: ${{ github.event.inputs.enable_coverage != false }}  # 👈 Skip if coverage disabled
      run: mkdir -p coverage-report && chmod 777 coverage-report

    - name: Run PHPUnit tests
      run: |
        vendor/bin/phpunit \
          --configuration phpunit.xml \
          ${{ (github.event.inputs.enable_coverage != false) && '--coverage-html coverage-report' || '' }}  # 👈 Conditional coverage

    - name: Upload coverage report
      if: ${{ github.event.inputs.enable_coverage != false }}  # 👈 Skip upload if no coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ${{ github.workspace }}/coverage-report/
