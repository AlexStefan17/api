name: Run PHPUnit Tests

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  
jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo code
      uses: actions/checkout@v2

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        tools: phpunit
        coverage: xdebug

    - name: Update dependencies
      run: composer update --prefer-dist --no-progress

    - name: Run PHPUnit tests and generate report
      run: vendor/bin/phpunit --configuration phpunit.xml --coverage-html coverage-report

    - name: Verify coverage report directory
      run: ls -la coverage-report/

    - name: Archive coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ${{ github.workspace }}/coverage-report/
