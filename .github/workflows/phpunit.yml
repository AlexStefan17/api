name: Run PHPUnit Tests

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        tools: phpunit
        coverage: xdebug
        ini-values: memory_limit=-1  # Prevent memory issues

    - name: Check installed PHP extensions
      run: php -m | grep -E 'xdebug|pcov' || echo "Coverage extension missing"

    - name: Install PCOV if missing
      run: |
        if ! php -m | grep -q 'pcov'; then
          pecl install pcov
          echo "zend_extension=pcov.so" >> $GITHUB_ENV
        fi

    - name: Update dependencies
      run: |
        composer validate --no-check-publish
        composer update --prefer-dist --no-progress

    - name: Run PHPUnit tests without coverage (debugging)
      run: vendor/bin/phpunit --configuration phpunit.xml || true

    - name: Run PHPUnit tests with coverage
      run: |
        vendor/bin/phpunit --configuration phpunit.xml --coverage-html ${{ github.workspace }}/coverage-report || true

    - name: Debug workspace and coverage directory
      run: |
        echo "Listing workspace contents:"
        ls -la ${{ github.workspace }}
        echo "Checking coverage directory:"
        ls -la ${{ github.workspace }}/coverage-report || echo "Coverage directory not found!"
        echo "Searching for coverage directories:"
        find ${{ github.workspace }} -type d -name "coverage*"

    - name: Upload coverage report (if available)
      if: success() || failure()  # Ensures the step runs even if tests fail
      run: |
        if [ -d "${{ github.workspace }}/coverage-report" ]; then
          echo "Uploading coverage..."
          mv ${{ github.workspace }}/coverage-report ${{ runner.temp }}/coverage-report
        else
          echo "No coverage report found."
        fi
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ${{ runner.temp }}/coverage-report/
        if-no-files-found: warn  # Prevents hard failure
