name: Run PHPUnit Tests

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        tools: phpunit
        coverage: xdebug
        ini-values: memory_limit=-1, xdebug.mode=coverage  # Ensure Xdebug is in coverage mode

    - name: Verify Xdebug is enabled
      run: php -m | grep xdebug || echo "Xdebug not found!"

    - name: Update dependencies
      run: |
        composer validate --no-check-publish
        composer update --prefer-dist --no-progress

    - name: Create coverage directory
      run: mkdir -p ${{ github.workspace }}/coverage-report && chmod -R 777 ${{ github.workspace }}/coverage-report

    - name: Verify PHPUnit Configuration
      run: cat phpunit.xml || echo "phpunit.xml not found!"

    - name: Run PHPUnit tests with coverage
      run: |
        vendor/bin/phpunit --configuration phpunit.xml --coverage-html=${{ github.workspace }}/coverage-report || true

    - name: Debug workspace and coverage directory
      run: |
        echo "Listing workspace contents:"
        ls -la ${{ github.workspace }}
        echo "Checking coverage directory:"
        ls -la ${{ github.workspace }}/coverage-report || echo "Coverage directory not found!"
        echo "Searching for coverage directories:"
        find ${{ github.workspace }} -type d -name "coverage*"

    - name: Upload coverage report (if available)
      if: success() || failure()  # Ensures the step runs even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ${{ github.workspace }}/coverage-report/
        if-no-files-found: warn  # Prevents hard failure
