name: Test Environment (PHP + Solr)

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: Job fixture to index
        type: choice
        default: job-30k.json.gz
        options:
          - job-30k.json.gz
          - job-50k.json.gz
      performance:
        description: k6 performance test to run against the local stack
        type: choice
        default: smoke
        options:
          - none
          - smoke
          - baseline
          - stress
          - stress_rps
          - spike
          - soak
      php_workers:
        description: PHP built-in server workers
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
          - '4'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Show runner resources
        run: |
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core' || true
          free -h
          df -h /
          cat /etc/os-release

      - name: Install PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl php-mbstring
          php -v

      - name: Check PHP syntax
        run: |
          php -l util/solr.php
          php -l util/loadEnv.php

      - name: Start Apache Solr
        env:
          SOLR_TEST_USER: ${{ secrets.SOLR_TEST_USER }}
          SOLR_TEST_PASS: ${{ secrets.SOLR_TEST_PASS }}
        run: |
          set -euo pipefail
          : "${SOLR_TEST_USER:?SOLR_TEST_USER secret is not set}"
          : "${SOLR_TEST_PASS:?SOLR_TEST_PASS secret is not set}"

          # Same version as production (zimbor.go.ro runs Solr 10.0.0). Solr 10
          # starts in SolrCloud by default; production runs standalone cores,
          # so --user-managed is required.
          docker run -d \
            --name solr \
            -p 127.0.0.1:8983:8983 \
            solr:10.0.0 \
            solr-foreground --user-managed

          for attempt in $(seq 1 60); do
            if curl -fsS \
              http://127.0.0.1:8983/solr/admin/info/system \
              > /dev/null; then
              echo "Solr is ready"
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Solr failed to start in time"
              docker logs solr
              exit 1
            fi

            sleep 2
          done

          # Production has exactly two cores, job and company. Each one gets
          # its own configset built from the schema captured from production,
          # so the uniqueKey (url for job, id for company) and the field types
          # match production.
          docker exec solr mkdir -p /var/solr/configsets
          for core in job company; do
            docker exec solr cp -r \
              /opt/solr/server/solr/configsets/_default \
              /var/solr/configsets/$core
            docker cp tests/test-data/performance/$core.schema.xml \
              solr:/var/solr/configsets/$core/conf/managed-schema.xml
          done
          docker exec -u 0 solr \
            chown -R solr:solr /var/solr/configsets

          docker exec solr bin/solr create \
            -c job -d /var/solr/configsets/job
          docker exec solr bin/solr create \
            -c company -d /var/solr/configsets/company

          # Solr refuses to start with BasicAuth and no users, so the auth
          # is switched on after the cores exist: security.json is written
          # with the same blockUnknown/admin setup as production, then Solr
          # is restarted to load it.
          python3 devops/solr/solr-security.py /tmp/solr-security.json
          docker cp /tmp/solr-security.json solr:/var/solr/data/security.json
          docker exec -u 0 solr \
            chown solr:solr /var/solr/data/security.json
          rm -f /tmp/solr-security.json
          docker restart solr

          for core in job company; do
            for attempt in $(seq 1 60); do
              if curl -fsS -u "$SOLR_TEST_USER:$SOLR_TEST_PASS" \
                "http://127.0.0.1:8983/solr/$core/select?q=*:*&rows=0" \
                > /dev/null; then
                echo "Core '$core' is ready"
                break
              fi

              if [ "$attempt" -eq 60 ]; then
                echo "Core '$core' did not become ready"
                docker logs solr
                exit 1
              fi

              sleep 2
            done
          done

      - name: Add suggest component to the job core
        env:
          SOLR_TEST_USER: ${{ secrets.SOLR_TEST_USER }}
          SOLR_TEST_PASS: ${{ secrets.SOLR_TEST_PASS }}
        run: |
          set -euo pipefail

          curl -fsS -u "$SOLR_TEST_USER:$SOLR_TEST_PASS" -X POST \
            -H 'Content-Type: application/json' \
            --data '{"add-searchcomponent":{"name":"suggest","class":"solr.SuggestComponent","suggester":{"name":"jobTitleSuggester","lookupImpl":"FuzzyLookupFactory","dictionaryImpl":"DocumentDictionaryFactory","field":"job_title","suggestAnalyzerFieldType":"text_general","buildOnCommit":"true","buildOnStartup":"false"}}}' \
            http://127.0.0.1:8983/solr/job/config > /dev/null

          curl -fsS -u "$SOLR_TEST_USER:$SOLR_TEST_PASS" -X POST \
            -H 'Content-Type: application/json' \
            --data '{"add-requesthandler":{"name":"/suggest","class":"solr.SearchHandler","startup":"lazy","defaults":{"suggest":"true","suggest.dictionary":"jobTitleSuggester","suggest.count":"10"},"components":["suggest"]}}' \
            http://127.0.0.1:8983/solr/job/config > /dev/null

          echo "Suggest component and /suggest handler added to the job core"

      - name: Load jobs and companies from the fixtures
        env:
          LOCAL_SOLR_URL: http://127.0.0.1:8983/solr
          FIXTURE: tests/test-data/performance/${{ inputs.fixture }}
          COMPANY_FIXTURE: tests/test-data/performance/company.json.gz
          SOLR_USER: ${{ secrets.SOLR_TEST_USER }}
          SOLR_PASS: ${{ secrets.SOLR_TEST_PASS }}
        run: |
          set -euo pipefail
          : "${SOLR_USER:?SOLR_TEST_USER secret is not set}"
          : "${SOLR_PASS:?SOLR_TEST_PASS secret is not set}"

          # The fixtures are subsets of the production snapshots, committed so
          # this workflow does not depend on production Solr (or its
          # credentials) at test time. The full snapshots are kept next to
          # them; refresh them with local_environment/Linux/backup_zimbor.sh.
          load() {
            local core="$1" file="$2" json expected local_total

            json=$(mktemp)
            gunzip -c "$file" > "$json"
            expected=$(python3 -c '
          import json, sys

          with open(sys.argv[1]) as handle:
              print(len(json.load(handle)))
          ' "$json")
            echo "Fixture for '$core' contains $expected documents"

            curl -fsS -u "$SOLR_USER:$SOLR_PASS" -X POST \
              -H 'Content-Type: application/json' \
              --data-binary @"$json" \
              "$LOCAL_SOLR_URL/$core/update?commit=true" > /dev/null

            local_total=$(curl -fsS -u "$SOLR_USER:$SOLR_PASS" \
              "$LOCAL_SOLR_URL/$core/select?q=*:*&rows=0&wt=json" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["response"]["numFound"])')
            echo "Local '$core' core now contains $local_total documents"

            rm -f "$json"

            if [ "$local_total" -ne "$expected" ]; then
              echo "ERROR: indexed $local_total of $expected '$core' documents"
              exit 1
            fi
          }

          load job "$FIXTURE"
          load company "$COMPANY_FIXTURE"

      - name: Configure connection
        env:
          SOLR_USER: ${{ secrets.SOLR_TEST_USER }}
          SOLR_PASS: ${{ secrets.SOLR_TEST_PASS }}
        run: |
          # The API loads api.env from the repository root.
          cat > api.env <<EOF
          SOLR_SERVER=localhost:8983
          LOCAL_SERVER=localhost:8983
          PROTOCOL=http
          SOLR_USER=${SOLR_USER}
          SOLR_PASS=${SOLR_PASS}
          EOF

      - name: Start PHP
        env:
          PHP_CLI_SERVER_WORKERS: ${{ inputs.php_workers }}
        run: |
          # php -S serves one request per worker at a time; the php_workers
          # input controls how much concurrency the load tests see.
          php -S 127.0.0.1:8000 -t . \
            > /tmp/php.log 2>&1 &
          echo $! > /tmp/php.pid

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "PHP is ready"
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "PHP failed to start"
              cat /tmp/php.log
              exit 1
            fi

            sleep 1
          done

      - name: Test services
        env:
          SOLR_USER: ${{ secrets.SOLR_TEST_USER }}
          SOLR_PASS: ${{ secrets.SOLR_TEST_PASS }}
        run: |
          set -euo pipefail

          anonymous=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:8983/solr/job/select?q=*:*&rows=0")
          if [ "$anonymous" != "401" ]; then
            echo "Solr answered an anonymous request with $anonymous, expected 401"
            exit 1
          fi
          echo "Solr rejects anonymous requests (401)"

          for core in job company; do
            curl -fsS -u "$SOLR_USER:$SOLR_PASS" \
              "http://127.0.0.1:8983/solr/$core/select?q=*:*&rows=0" \
              > /dev/null
            echo "Solr core '$core' responds"
          done

          jobs=$(curl -fsS -u "$SOLR_USER:$SOLR_PASS" \
            "http://127.0.0.1:8983/solr/job/select?q=*:*&rows=0&wt=json" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["response"]["numFound"])')
          echo "Local job core contains $jobs documents"

          if [ "$jobs" -lt 1 ]; then
            echo "Local job core is empty; the fixture did not populate it"
            exit 1
          fi

          companies=$(curl -fsS -u "$SOLR_USER:$SOLR_PASS" \
            "http://127.0.0.1:8983/solr/company/select?q=*:*&rows=0&wt=json" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["response"]["numFound"])')
          echo "Local company core contains $companies documents"

          if [ "$companies" -lt 1 ]; then
            echo "Local company core is empty; the fixture did not populate it"
            exit 1
          fi

          curl -fsS http://127.0.0.1:8000/ > /dev/null
          echo "Documentation page responds"

          health=$(curl -fsSL http://127.0.0.1:8000/v1/health/)
          echo "v1/health: $health"

          if ! echo "$health" | grep -q '"status":"pass"'; then
            echo "Health check failed"
            exit 1
          fi

          # GET /v1/total/ reads both the job and company cores.
          total=$(curl -fsSL http://127.0.0.1:8000/v1/total/)
          echo "v1/total: $total"

          jobs_total=$(printf '%s' "$total" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          print(data["total"]["jobs"])
          ')
          echo "v1/total reports $jobs_total jobs"

          if [ "$jobs_total" -lt 1 ]; then
            echo "v1/total reported no jobs"
            exit 1
          fi

          # GET /v1/random/ only returns 200 when at least one job exists.
          random=$(curl -fsSL http://127.0.0.1:8000/v1/random/)
          echo "v1/random: $random"

          printf '%s' "$random" | python3 -c '
          import json, sys
          job = json.load(sys.stdin)
          if not isinstance(job, dict) or "title" not in job:
              raise SystemExit("v1/random did not return a job")
          '

          echo "All basic tests passed!"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Run functional tests against Solr
        run: npm run test:functional

      - name: Install k6
        if: inputs.performance != 'none'
        uses: grafana/setup-k6-action@v1

      - name: Warm up the API
        if: inputs.performance != 'none'
        env:
          BASE_URL: http://127.0.0.1:8000
          ENDPOINT: /v1/total/
          RESULTS_DIR: /tmp/warmup
          NO_HTML: '1'
          SMOKE_VUS: '2'
          SMOKE_DURATION: 15s
        run: |
          # Short warm-up so cold-start latency does not contaminate the
          # percentiles of the actual test. Results stay out of the artifact.
          ./tests/performance/run.sh smoke --no-thresholds

      - name: Run k6 performance test
        if: inputs.performance != 'none'
        continue-on-error: ${{ inputs.performance == 'baseline' }}
        env:
          BASE_URL: http://127.0.0.1:8000
          ENDPOINT: /v1/total/
          RESULTS_DIR: tests/performance/results
        run: |
          set -euo pipefail

          test="${{ inputs.performance }}"

          # stress, stress_rps and spike exist to find the breaking point: a
          # failed threshold is the expected result, not a CI error.
          case "$test" in
            stress|stress_rps|spike) extra=--no-thresholds ;;
            *)                       extra= ;;
          esac

          ./tests/performance/run.sh "$test" $extra

      - name: Publish performance summary
        if: always() && inputs.performance != 'none'
        run: |
          file="tests/performance/results/${{ inputs.performance }}-summary.txt"

          if [ ! -f "$file" ]; then
            echo "No k6 summary was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## k6 ${{ inputs.performance }} (fixture: ${{ inputs.fixture }})"
            echo '```'
            cat "$file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance reports
        if: always() && inputs.performance != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: performance-${{ inputs.performance }}-${{ inputs.fixture }}
          path: tests/performance/results/
          retention-days: 30

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- PHP log ---"
          cat /tmp/php.log 2>/dev/null || true

          echo "--- Solr log ---"
          docker logs solr 2>/dev/null || true
